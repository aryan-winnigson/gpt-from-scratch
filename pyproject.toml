[project]
name = "gpt-from-scratch"
version = "0.1.0"
description = "A GPT built from first principles, one stage at a time."
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch>=2.5",
    "numpy>=2.0",
    "pytest>=8.0",
    "matplotlib>=3.9",
    "tqdm>=4.66",
    "requests>=2.32",
    "tiktoken>=0.8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
